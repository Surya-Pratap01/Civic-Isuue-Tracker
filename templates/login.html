<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login • Civic Issue Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css"/>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#f8fafc; color:#0f172a; }
    .container { max-width: 420px; margin: 50px auto; background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); border:1px solid #eef2ff; }
    h1 { margin: 0 0 16px; font-size: 22px; font-weight: 800; letter-spacing: .2px; }
    p.sub { color:#475569; margin-top:0; }
    .field { margin: 12px 0; }
    label { display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color:#334155; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border:1px solid #e5e7eb; background:#fff; }
    .btn { display:block; width:100%; background:#4f46e5; color:#fff; border:none; padding: 12px 16px; border-radius: 12px; font-weight: 800; cursor:pointer; }
    .btn:hover { background:#4338ca; }
    .flash { padding:10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .flash.success { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .flash.warning { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
    .flash.danger { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .muted { color:#64748b; font-size:12px; margin-top:10px; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Login</h1>
    <p class="sub">Enter your admin credentials to access the dashboard.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('admin_login', next=request.args.get('next')) }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button class="btn" type="submit">Sign in</button>
      <p class="muted">Default credentials (change via env): admin / admin123</p>
    </form>
  </div>
</body>
</html>
